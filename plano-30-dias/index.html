<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Salgados do Fundão — Plano 30 dias</title>
<style>
:root{--bg:#f7ead0;--ink:#171512;--red:#c84b32;--green:#3d6a50;--card:#fffaf0;--fs:22px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif;font-size:var(--fs);line-height:1.35}
header{position:sticky;top:0;z-index:10;background:#111;color:#fff;padding:18px 5vw;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.brand{font-weight:900;letter-spacing:.04em}.tools{display:flex;gap:10px;flex-wrap:wrap}
button{font:inherit;font-weight:800;border:3px solid currentColor;border-radius:999px;padding:10px 16px;background:transparent;color:inherit;cursor:pointer}button.active{background:#fff;color:#111}
.hero,.section{min-height:100vh;padding:9vh 7vw;display:flex;flex-direction:column;justify-content:center}.hero{background:linear-gradient(135deg,#fff6df 0 60%,#ead39e 60%)}
h1,h2{font-size:clamp(44px,7vw,88px);line-height:.95;margin:0 0 28px;font-weight:900;max-width:1000px}h2{font-size:clamp(38px,5vw,68px)}.lead{font-size:clamp(24px,3vw,40px);max-width:1000px}
.flow{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:35px}.step{width:min(760px,100%);background:var(--card);border:4px solid var(--ink);border-radius:28px;padding:24px;text-align:center;font-weight:900;font-size:clamp(24px,3vw,38px);box-shadow:12px 12px 0 rgba(0,0,0,.14)}.arrow{font-size:52px;color:var(--red);line-height:1}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:22px;margin-top:28px}.card{background:var(--card);border:4px solid var(--ink);border-radius:26px;padding:26px;min-height:180px}.card b{display:block;font-size:1.35em;margin-bottom:10px}.good{background:#e6f0e9}.bad{background:#f7dfda}.price{font-size:clamp(42px,7vw,86px);font-weight:900}.cta{background:#111;color:white;text-align:center}.cta .step{background:white;color:#111}.small{font-size:.8em;opacity:.75}
@media(max-width:650px){header{position:relative}.hero,.section{min-height:auto;padding:55px 24px}.step{padding:20px 16px}.tools button{padding:8px 12px}}
</style>
</head>
<body>
<header><div class="brand">SALGADOS DO FUNDÃO — PLANO 30 DIAS</div><div class="tools"><button id="ptBtn" class="active" onclick="setLang('pt')">Português</button><button id="ruBtn" onclick="setLang('ru')">Русский</button><button onclick="zoom(-1)">A−</button><button onclick="zoom(1)">A+</button></div></header>
<main>
<section class="hero"><h1 data-pt="Como conseguir novos clientes em 30 dias" data-ru="Как получить новых клиентов за 30 дней"></h1><p class="lead" data-pt="Um plano claro: o que fazemos, quanto custa e que resultado vamos testar." data-ru="Понятный план: что делаем, сколько это стоит и какой результат проверяем."></p><div class="flow"><div class="step" data-pt="📷 Fotos" data-ru="📷 Фото"></div><div class="arrow">↓</div><div class="step" data-pt="🎥 Vídeos" data-ru="🎥 Видео"></div><div class="arrow">↓</div><div class="step">Facebook + Instagram</div><div class="arrow">↓</div><div class="step" data-pt="🌍 Site" data-ru="🌍 Сайт"></div><div class="arrow">↓</div><div class="step">💬 WhatsApp</div><div class="arrow">↓</div><div class="step" data-pt="💶 Encomenda" data-ru="💶 Заказ"></div></div></section>
<section class="section"><h2 data-pt="Hoje" data-ru="Сейчас"></h2><div class="grid"><div class="card bad"><b data-pt="Pouca visibilidade" data-ru="Мало кто видит продукцию"></b><span data-pt="A maioria das vendas vem de clientes antigos e recomendações." data-ru="Большинство продаж приходит от старых клиентов и рекомендаций."></span></div><div class="card bad"><b data-pt="Sem medição" data-ru="Нет точных цифр"></b><span data-pt="Não sabemos quantas pessoas veem, perguntam e compram." data-ru="Мы не знаем, сколько людей смотрит, спрашивает и покупает."></span></div></div></section>
<section class="section"><h2 data-pt="Quem pode comprar" data-ru="Кто может покупать"></h2><div class="grid"><div class="card"><b data-pt="👨‍👩‍👧 Famílias" data-ru="👨‍👩‍👧 Семьи"></b><span data-pt="Aniversários e fins de semana." data-ru="Дни рождения и выходные."></span></div><div class="card"><b data-pt="☕ Cafés" data-ru="☕ Кафе"></b><span data-pt="Compras todas as semanas." data-ru="Покупки каждую неделю."></span></div><div class="card"><b data-pt="🎉 Festas" data-ru="🎉 Праздники"></b><span data-pt="Casamentos, batizados e eventos." data-ru="Свадьбы, крестины и мероприятия."></span></div><div class="card"><b data-pt="🎓 Estudantes" data-ru="🎓 Студенты"></b><span data-pt="Jantares e encontros." data-ru="Вечеринки и встречи."></span></div><div class="card"><b data-pt="🏢 Empresas" data-ru="🏢 Компании"></b><span data-pt="Reuniões e pequenos-almoços." data-ru="Совещания и завтраки."></span></div></div></section>
<section class="section"><h2 data-pt="O que eu faço" data-ru="Что я делаю"></h2><div class="flow"><div class="step" data-pt="1. Escolher 3 ofertas simples" data-ru="1. Выбрать 3 понятных предложения"></div><div class="arrow">↓</div><div class="step" data-pt="2. Fazer fotos e vídeos" data-ru="2. Сделать фото и видео"></div><div class="arrow">↓</div><div class="step" data-pt="3. Preparar o site" data-ru="3. Подготовить сайт"></div><div class="arrow">↓</div><div class="step" data-pt="4. Organizar Facebook e Instagram" data-ru="4. Оформить Facebook и Instagram"></div><div class="arrow">↓</div><div class="step" data-pt="5. Lançar publicidade local" data-ru="5. Запустить местную рекламу"></div><div class="arrow">↓</div><div class="step" data-pt="6. Contar mensagens e pedidos" data-ru="6. Посчитать сообщения и заказы"></div></div></section>
<section class="section"><h2 data-pt="O que a empresa recebe" data-ru="Что получает компания"></h2><div class="grid"><div class="card good"><b data-pt="Site atualizado" data-ru="Обновлённый сайт"></b></div><div class="card good"><b data-pt="20–30 fotografias" data-ru="20–30 фотографий"></b></div><div class="card good"><b data-pt="8 vídeos curtos" data-ru="8 коротких видео"></b></div><div class="card good"><b data-pt="Facebook e Instagram ativos" data-ru="Активные Facebook и Instagram"></b></div><div class="card good"><b data-pt="Publicidade local" data-ru="Местная реклама"></b></div><div class="card good"><b data-pt="Relatório simples" data-ru="Простой отчёт"></b><span data-pt="Visitas, mensagens e encomendas." data-ru="Посещения, сообщения и заказы."></span></div></div></section>
<section class="section"><h2 data-pt="Preço do primeiro teste" data-ru="Цена первого теста"></h2><div class="grid"><div class="card"><div class="price">300 €</div><b data-pt="Trabalho" data-ru="Работа"></b></div><div class="card"><div class="price">150 €</div><b data-pt="Publicidade" data-ru="Реклама"></b></div><div class="card good"><div class="price">450 €</div><b data-pt="Total por 30 dias" data-ru="Всего за 30 дней"></b></div></div><p class="small" data-pt="A publicidade é paga diretamente à Meta. O resultado depende do mercado e não pode ser garantido." data-ru="Реклама оплачивается напрямую Meta. Результат зависит от рынка и не может быть гарантирован."></p></section>
<section class="section cta"><h2 data-pt="Como trabalhamos a seguir?" data-ru="Как работаем дальше?"></h2><div class="flow"><div class="step" data-pt="1. Diz que sim" data-ru="1. Вы говорите «Да»"></div><div class="arrow">↓</div><div class="step" data-pt="2. Definimos produtos, preços e entrega" data-ru="2. Уточняем товары, цены и доставку"></div><div class="arrow">↓</div><div class="step" data-pt="3. Faço a sessão de fotos e vídeos" data-ru="3. Я снимаю фото и видео"></div><div class="arrow">↓</div><div class="step" data-pt="4. Publico o site e as redes sociais" data-ru="4. Публикую сайт и соцсети"></div><div class="arrow">↓</div><div class="step" data-pt="5. Lanço a publicidade" data-ru="5. Запускаю рекламу"></div><div class="arrow">↓</div><div class="step" data-pt="6. Após 30 dias, vemos os resultados" data-ru="6. Через 30 дней смотрим результат"></div></div></section>
</main>
<script>let lang='pt',size=22;function setLang(l){lang=l;document.documentElement.lang=l;document.querySelectorAll('[data-pt]').forEach(el=>el.textContent=el.dataset[l]);ptBtn.classList.toggle('active',l==='pt');ruBtn.classList.toggle('active',l==='ru')}function zoom(d){size=Math.max(18,Math.min(34,size+d*2));document.documentElement.style.setProperty('--fs',size+'px')}setLang('pt');</script>
</body>
</html>
