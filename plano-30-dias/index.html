<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Salgados do Fundão — Plano 30 dias</title>
<style>
:root{--bg:#f7ead0;--ink:#171512;--red:#c84b32;--green:#3d6a50;--card:#fffaf0;--fs:22px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif;font-size:var(--fs);line-height:1.4}
header{position:sticky;top:0;z-index:10;background:#111;color:#fff;padding:16px 5vw;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.brand{font-weight:900}.tools{display:flex;gap:10px;flex-wrap:wrap}
button{font:inherit;font-weight:800;border:3px solid currentColor;border-radius:999px;padding:9px 15px;background:transparent;color:inherit;cursor:pointer}button.active{background:#fff;color:#111}
.hero,.section{min-height:100vh;padding:9vh 7vw;display:flex;flex-direction:column;justify-content:center}.hero{background:linear-gradient(135deg,#fff6df 0 60%,#ead39e 60%)}
h1,h2{font-size:clamp(44px,7vw,88px);line-height:.98;margin:0 0 28px;font-weight:900;max-width:1100px}h2{font-size:clamp(38px,5vw,68px)}.lead{font-size:clamp(24px,3vw,40px);max-width:1000px}
.flow{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:35px}.step{width:min(780px,100%);background:var(--card);border:4px solid var(--ink);border-radius:28px;padding:24px;text-align:center;font-weight:900;font-size:clamp(24px,3vw,38px);box-shadow:12px 12px 0 rgba(0,0,0,.14)}.arrow{font-size:52px;color:var(--red);line-height:1}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:22px;margin-top:28px}.card{background:var(--card);border:4px solid var(--ink);border-radius:26px;padding:26px;min-height:180px}.card b{display:block;font-size:1.35em;margin-bottom:10px}.good{background:#e6f0e9}.bad{background:#f7dfda}.price{font-size:clamp(42px,7vw,86px);font-weight:900}.person{font-size:64px;margin-bottom:12px}.scenario{position:relative;padding-top:34px}.scenario:before{position:absolute;top:-18px;left:24px;background:#111;color:#fff;border-radius:999px;padding:8px 16px;font-weight:900}.s1:before{content:'1'}.s2:before{content:'2'}.s3:before{content:'3'}.result{font-size:1.15em;font-weight:800;margin-top:18px}.cta{background:#111;color:white;text-align:center}.cta .step{background:white;color:#111}.small{font-size:.82em;opacity:.78;max-width:1000px}.highlight{color:var(--red)}
@media(max-width:650px){header{position:relative}.hero,.section{min-height:auto;padding:55px 24px}.step{padding:20px 16px}.tools button{padding:8px 12px}.person{font-size:52px}}
</style>
</head>
<body>
<header><div class="brand">SALGADOS DO FUNDÃO — PLANO 30 DIAS</div><div class="tools"><button id="ptBtn" class="active" onclick="setLang('pt')">Português</button><button id="ruBtn" onclick="setLang('ru')">Русский</button><button onclick="zoom(-1)">A−</button><button onclick="zoom(1)">A+</button></div></header>
<main>
<section class="hero"><h1 data-pt="Como conseguir novos clientes em 30 dias" data-ru="Как получить новых клиентов за 30 дней"></h1><p class="lead" data-pt="Mostramos o produto, levamos a pessoa até ao WhatsApp e medimos os pedidos." data-ru="Показываем продукт, приводим человека в WhatsApp и считаем заказы."></p><div class="flow"><div class="step" data-pt="📷 Fotos e vídeos" data-ru="📷 Фото и видео"></div><div class="arrow">↓</div><div class="step">Facebook + Instagram</div><div class="arrow">↓</div><div class="step" data-pt="🌍 Site simples" data-ru="🌍 Понятный сайт"></div><div class="arrow">↓</div><div class="step">💬 WhatsApp</div><div class="arrow">↓</div><div class="step" data-pt="💶 Nova encomenda" data-ru="💶 Новый заказ"></div></div></section>

<section class="section"><h2 data-pt="O que acontece hoje" data-ru="Что происходит сейчас"></h2><div class="grid"><div class="card bad"><div class="person">👨‍🍳</div><b data-pt="O produto é bom" data-ru="Продукт хороший"></b><span data-pt="Mas poucas pessoas novas o veem." data-ru="Но его видит мало новых людей."></span></div><div class="card bad"><div class="person">📵</div><b data-pt="Não há caminho simples para comprar" data-ru="Нет простого пути к покупке"></b><span data-pt="A pessoa vê, mas não sabe logo o preço, a oferta e onde pedir." data-ru="Человек видит, но сразу не понимает цену, предложение и куда писать."></span></div><div class="card bad"><div class="person">❓</div><b data-pt="Não há números" data-ru="Нет точных цифр"></b><span data-pt="Não sabemos quantas pessoas viram, escreveram e compraram." data-ru="Мы не знаем, сколько людей увидели, написали и купили."></span></div></div></section>

<section class="section"><h2 data-pt="Quem pode comprar" data-ru="Кто может покупать"></h2><div class="grid"><div class="card"><div class="person">👨‍👩‍👧</div><b data-pt="Famílias" data-ru="Семьи"></b><span data-pt="Aniversários e fins de semana." data-ru="Дни рождения и выходные."></span></div><div class="card"><div class="person">☕</div><b data-pt="Cafés" data-ru="Кафе"></b><span data-pt="Compras regulares todas as semanas." data-ru="Регулярные покупки каждую неделю."></span></div><div class="card"><div class="person">🎉</div><b data-pt="Festas" data-ru="Праздники"></b><span data-pt="Casamentos, batizados e eventos." data-ru="Свадьбы, крестины и мероприятия."></span></div><div class="card"><div class="person">🏢</div><b data-pt="Empresas" data-ru="Компании"></b><span data-pt="Reuniões, equipas e pequenos-almoços." data-ru="Совещания, коллективы и завтраки."></span></div></div></section>

<section class="section"><h2 data-pt="O que fazemos em 30 dias" data-ru="Что делаем за 30 дней"></h2><div class="flow"><div class="step" data-pt="1. Escolhemos 3 ofertas simples" data-ru="1. Выбираем 3 понятных предложения"></div><div class="arrow">↓</div><div class="step" data-pt="2. Fazemos fotos e vídeos" data-ru="2. Делаем фото и видео"></div><div class="arrow">↓</div><div class="step" data-pt="3. Organizamos o site e as redes sociais" data-ru="3. Оформляем сайт и социальные сети"></div><div class="arrow">↓</div><div class="step" data-pt="4. Lançamos publicidade local" data-ru="4. Запускаем местную рекламу"></div><div class="arrow">↓</div><div class="step" data-pt="5. Recebemos pedidos no WhatsApp" data-ru="5. Получаем заявки в WhatsApp"></div><div class="arrow">↓</div><div class="step" data-pt="6. Contamos o resultado" data-ru="6. Считаем результат"></div></div></section>

<section class="section"><h2 data-pt="O que fica na empresa" data-ru="Что останется у компании"></h2><div class="grid"><div class="card good"><b data-pt="Site pronto" data-ru="Готовый сайт"></b><span data-pt="Pode continuar a receber pedidos depois do teste." data-ru="Он продолжит принимать заявки после теста."></span></div><div class="card good"><b data-pt="20–30 fotografias" data-ru="20–30 фотографий"></b><span data-pt="Para site, redes sociais e catálogo." data-ru="Для сайта, соцсетей и каталога."></span></div><div class="card good"><b data-pt="8 vídeos curtos" data-ru="8 коротких видео"></b><span data-pt="Para mostrar produtos e ofertas." data-ru="Чтобы показывать продукцию и предложения."></span></div><div class="card good"><b data-pt="Redes sociais organizadas" data-ru="Оформленные соцсети"></b></div><div class="card good"><b data-pt="Publicidade configurada" data-ru="Настроенная реклама"></b></div><div class="card good"><b data-pt="Relatório com números" data-ru="Отчёт с цифрами"></b><span data-pt="Visualizações, mensagens e encomendas." data-ru="Просмотры, сообщения и заказы."></span></div></div></section>

<section class="section"><h2 data-pt="Investimento do primeiro teste" data-ru="Вложение в первый тест"></h2><div class="grid"><div class="card"><div class="price">300 €</div><b data-pt="Todo o trabalho" data-ru="Вся работа"></b></div><div class="card"><div class="price">150 €</div><b data-pt="Publicidade" data-ru="Реклама"></b></div><div class="card good"><div class="price">450 €</div><b data-pt="Total por 30 dias" data-ru="Всего за 30 дней"></b></div></div><p class="small" data-pt="A publicidade é paga diretamente à Meta. Não prometemos um número exato de vendas: testamos o mercado e mostramos o resultado real." data-ru="Реклама оплачивается напрямую Meta. Мы не обещаем точное число продаж: мы проверяем рынок и показываем реальный результат."></p></section>

<section class="section"><h2 data-pt="3 resultados possíveis" data-ru="3 возможных результата"></h2><p class="lead" data-pt="Em qualquer cenário, a empresa recebe materiais e informação úteis." data-ru="При любом сценарии компания получает полезные материалы и информацию."></p><div class="grid"><div class="card scenario s1"><div class="person">🌱</div><b data-pt="Poucos pedidos" data-ru="Мало заказов"></b><span data-pt="Descobrimos que a oferta, o preço ou a mensagem precisam de mudar." data-ru="Мы понимаем, что нужно изменить предложение, цену или сообщение."></span><div class="result" data-pt="A empresa não fica sem nada: ficam o site, as fotos, os vídeos e os dados." data-ru="Компания не остаётся ни с чем: остаются сайт, фото, видео и данные."></div></div><div class="card scenario s2 good"><div class="person">📈</div><b data-pt="O investimento começa a voltar" data-ru="Вложения начинают возвращаться"></b><span data-pt="Chegam novos pedidos e percebemos quais produtos vendem melhor." data-ru="Приходят новые заказы, и мы видим, какие продукты продаются лучше."></span><div class="result" data-pt="Mantemos o que funciona e melhoramos a publicidade." data-ru="Оставляем то, что работает, и улучшаем рекламу."></div></div><div class="card scenario s3 good"><div class="person">🚀</div><b data-pt="Resultado forte" data-ru="Сильный результат"></b><span data-pt="Os pedidos cobrem o teste e criam uma nova fonte regular de clientes." data-ru="Заказы покрывают тест и создают новый постоянный источник клиентов."></span><div class="result" data-pt="Aumentamos o orçamento com cuidado e repetimos o sistema." data-ru="Осторожно увеличиваем бюджет и повторяем систему."></div></div></div></section>

<section class="section cta"><h2 data-pt="Como trabalhamos a seguir?" data-ru="Как работаем дальше?"></h2><div class="flow"><div class="step" data-pt="1. Aprovamos o teste de 30 dias" data-ru="1. Утверждаем тест на 30 дней"></div><div class="arrow">↓</div><div class="step" data-pt="2. Definimos produtos, preços e entrega" data-ru="2. Уточняем товары, цены и доставку"></div><div class="arrow">↓</div><div class="step" data-pt="3. Faço fotos, vídeos e preparo o site" data-ru="3. Я делаю фото, видео и готовлю сайт"></div><div class="arrow">↓</div><div class="step" data-pt="4. Lançamos as publicações e a publicidade" data-ru="4. Запускаем публикации и рекламу"></div><div class="arrow">↓</div><div class="step" data-pt="5. Recebemos e registamos os pedidos" data-ru="5. Получаем и записываем заказы"></div><div class="arrow">↓</div><div class="step" data-pt="6. Ao fim de 30 dias, decidimos o próximo passo" data-ru="6. Через 30 дней принимаем решение о следующем шаге"></div></div></section>
</main>
<script>let lang='pt',size=22;function setLang(l){lang=l;document.documentElement.lang=l;document.querySelectorAll('[data-pt]').forEach(el=>el.textContent=el.dataset[l]);ptBtn.classList.toggle('active',l==='pt');ruBtn.classList.toggle('active',l==='ru')}function zoom(d){size=Math.max(18,Math.min(34,size+d*2));document.documentElement.style.setProperty('--fs',size+'px')}setLang('pt');</script>
</body>
</html>
