name: Build RotaPago Finance APK

on:
  push:
    branches: [rotapago-finance]
    paths:
      - 'android/RotaPagoFinance/**'
      - '.github/workflows/rotapago-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Reconstruct Java source
        run: |
          mkdir -p android/RotaPagoFinance/app/src/main/java/com/ivan/rotapago
          cat android/RotaPagoFinance/source_parts/MainActivity.b64.* | tr -d '\n\r ' | base64 -d > android/RotaPagoFinance/app/src/main/java/com/ivan/rotapago/MainActivity.java

      - name: Build debug APK
        run: gradle -p android/RotaPagoFinance :app:assembleDebug --stacktrace

      - name: Prepare artifact
        run: cp android/RotaPagoFinance/app/build/outputs/apk/debug/app-debug.apk RotaPago-Finance.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RotaPago-Finance-APK
          path: RotaPago-Finance.apk
          retention-days: 14
