name: Build RotaPago Finance APK

on:
  push:
    branches: [rotapago-finance]
    paths:
      - 'android/RotaPagoFinance/**'
      - '.github/workflows/rotapago-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /home/runner/android-sdk
      ANDROID_SDK_ROOT: /home/runner/android-sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android command line tools
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp/android-tools
          mv /tmp/android-tools/cmdline-tools "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle -p android/RotaPagoFinance :app:assembleDebug --stacktrace

      - name: Prepare artifact
        run: cp android/RotaPagoFinance/app/build/outputs/apk/debug/app-debug.apk RotaPago-Finance-v1.2.apk

      - name: Locate signing key
        run: find /home/runner -type f \( -name '*.keystore' -o -name '*.jks' \) -print || true

      - uses: actions/upload-artifact@v4
        with:
          name: RotaPago-Finance-v1.2
          path: RotaPago-Finance-v1.2.apk
          retention-days: 30
